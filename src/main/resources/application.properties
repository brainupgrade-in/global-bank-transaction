spring.application.name=transaction
server.port=8087

#SERVLET PATH
server.error.include-stacktrace=never
server.servlet.context-path=/transaction

#H2
spring.datasource.url=jdbc:h2:mem:transaction
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.sql.init.mode=always
#Boot 2.5+ runs data.sql BEFORE Hibernate creates tables; defer it so seed
#data lands after ddl-auto. Without this the app compiles but dies on startup.
spring.jpa.defer-datasource-initialization=true



feign.url-account-service=${ACCOUNT_SERVICE_URL:localhost:8086/account}
feign.url-rule-service=${RULE_SERVICE_URL:localhost:8090/rules}

#ACTUATOR - kubernetes liveness/readiness probes
#Served under the context path: /transaction/actuator/health/{liveness,readiness}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

#POSTING API (payroll disbursements post to global-bank-account)
posting.base-url=http://${ACCOUNT_SERVICE_URL:localhost:8086/account}
posting.funding-account-id=ACC-PAYROLL
